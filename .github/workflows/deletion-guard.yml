name: Deletion guard

on:
  pull_request:
    types:
      [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: deletion-guard-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  guard:
    name: No deleted migrations or files of others
    runs-on: ubuntu-latest

    steps:
      - name: Drop the approval after new commits
        if: github.event.action == 'synchronize' && contains(github.event.pull_request.labels.*.name, 'Approved deletion')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR_NUMBER" --remove-label "Approved deletion"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Deletion guard
        env:
          APPROVER: ${{ github.repository_owner }}
          BASE_REF: origin/${{ github.base_ref }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/deletion-guard.mjs
