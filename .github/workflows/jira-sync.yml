name: Jira sync

on:
  create:
  pull_request:
    types: [closed]
    branches: [develop]

concurrency:
  group: jira-sync-${{ github.event.ref || github.head_ref }}

jobs:
  sync:
    name: Move the story in Jira
    if: >-
      (github.event_name == 'create' && github.event.ref_type == 'branch') ||
      (github.event_name == 'pull_request' && github.event.pull_request.merged)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: List open pull request branches
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "OPEN_BRANCHES=$(gh pr list --repo "${{ github.repository }}" --state open --limit 200 --json headRefName --jq '[.[].headRefName] | join(",")')" >> "$GITHUB_ENV"

      - name: Sync
        env:
          EVENT: ${{ github.event_name == 'create' && 'started' || 'merged' }}
          BRANCH: ${{ github.event_name == 'create' && github.event.ref || github.head_ref }}
          JIRA_BASE_URL: ${{ vars.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        run: node .github/scripts/jira-sync.mjs
