name: Supabase migrations

on:
  push:
    branches: [main]
    paths:
      - supabase/migrations/**
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply migrations to the cloud database
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read

    env:
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      SUPABASE_DB_HOST: ${{ vars.SUPABASE_DB_HOST }}

    steps:
      - name: Check the production connection settings
        id: credentials
        run: |
          if [ -z "$SUPABASE_DB_PASSWORD" ] || [ -z "$SUPABASE_PROJECT_REF" ] || [ -z "$SUPABASE_DB_HOST" ]; then
            echo "The production environment has no database connection yet; nothing to apply."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.credentials.outputs.ready == 'true'

      - uses: supabase/setup-cli@v1
        if: steps.credentials.outputs.ready == 'true'
        with:
          version: latest

      - name: Build the connection string
        if: steps.credentials.outputs.ready == 'true'
        run: |
          echo "::add-mask::$SUPABASE_DB_PASSWORD"
          echo "DB_URL=postgresql://postgres.$SUPABASE_PROJECT_REF:$SUPABASE_DB_PASSWORD@$SUPABASE_DB_HOST:5432/postgres" >> "$GITHUB_ENV"

      - name: List the migrations that would be applied
        if: steps.credentials.outputs.ready == 'true'
        run: supabase db push --dry-run --db-url "$DB_URL"

      - name: Apply the migrations
        if: steps.credentials.outputs.ready == 'true'
        run: supabase db push --yes --db-url "$DB_URL"
