name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest

    env:
      # The build only needs these to exist. Real keys live in the
      # deployment environment, never in the repository.
      NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Changelog fragment
        if: github.event_name == 'pull_request'
        run: npm run changelog:check -- origin/${{ github.base_ref }}

      - name: Generated agents in sync
        run: npm run agents:check

      - name: Format
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Tests
        run: npm run test:run

      - name: Build
        run: npm run build
